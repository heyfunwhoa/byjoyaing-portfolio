name: Visual QA (bounded)
on:
  pull_request:
    branches: [main]
    paths:
      - ".storybook/**"
      - "components/ui/**"
      - "components/design-lab/**"
      - "components/field-notes/**"
      - "lib/component-options.ts"
      - "app/globals.css"
      - "tests/visual/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  storybook-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run storybook:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-debug
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
