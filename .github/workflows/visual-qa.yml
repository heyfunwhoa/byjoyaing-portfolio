name: Visual QA (bounded)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  storybook-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether PR changes only documentation
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [[ -n "$changed_files" ]] && ! printf '%s\n' "$changed_files" | grep -Ev '^docs/'; then
            echo 'Only docs/ files changed; visual checks are unnecessary.'
            echo 'run_visual=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run_visual == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - if: steps.changes.outputs.run_visual == 'true'
        run: npm ci
      - if: steps.changes.outputs.run_visual == 'true'
        run: npm run storybook:build
      - if: steps.changes.outputs.run_visual == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.run_visual == 'true'
        run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-debug
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
