name: Security / Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full-repository lookback scan, staggered across projects (UTC).
    - cron: '37 11 * * 2'

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0

      # Semgrep scans the entire checked-out repository on PRs and on main.
      # Findings are blocking; never mask failures with continue-on-error.
      - name: Run Semgrep scan
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off --exclude node_modules --exclude .next --exclude dist .
