name: Security / Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full-repository lookback scan, staggered across projects (UTC).
    - cron: '37 11 * * 2'

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.180.0

      # Semgrep scans the entire checked-out repository on PRs and on main.
      # Findings are blocking; never mask failures with continue-on-error.
      - name: Run Semgrep scan
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off --exclude node_modules --exclude .next --exclude dist .
