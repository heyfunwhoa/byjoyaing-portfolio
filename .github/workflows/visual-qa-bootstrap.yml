name: Visual QA bootstrap (one-time)
on:
  push:
    branches: [feat/storybook-playwright-finops-20261012]
    paths:
      - ".github/workflows/visual-qa-bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visual-qa-bootstrap.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: storybook-bootstrap
  cancel-in-progress: false
jobs:
  resolve-dependencies-and-baselines:
    if: github.repository == 'heyfunwhoa/byjoyaing-portfolio' && (github.ref == 'refs/heads/feat/storybook-playwright-finops-20261012' || github.head_ref == 'feat/storybook-playwright-finops-20261012')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve dependencies and lockfile
        run: npm install --save-dev 'storybook@^10' '@storybook/nextjs-vite@^10' '@playwright/test@^1'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build isolated stories
        run: npm run storybook:build
      - name: Generate first visual baselines
        run: npm run test:visual:update
      - name: Commit reproducible lockfile and baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json tests/visual
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock visual QA dependencies and capture baseline screenshots"
            git fetch origin feat/storybook-playwright-finops-20261012
            git rebase origin/feat/storybook-playwright-finops-20261012
            git push origin HEAD:feat/storybook-playwright-finops-20261012
          fi
