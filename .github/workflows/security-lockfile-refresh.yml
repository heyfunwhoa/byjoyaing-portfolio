name: One-time P0 lockfile remediation

on:
  push:
    branches: [security/p0-next-dependency-remediation]
    paths:
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'heyfunwhoa/byjoyaing-portfolio' && github.ref == 'refs/heads/security/p0-next-dependency-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade reviewed patch target and regenerate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact next@16.4.0 eslint-config-next@16.4.0
          npm update --package-lock-only --ignore-scripts --no-audit --save=false sharp source-map-js
          npm ls next sharp source-map-js --all || true
      - name: Commit actual npm-generated lockfile to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: patch Next.js and vulnerable transitive dependencies"
            git push origin HEAD:security/p0-next-dependency-remediation
          fi
      - name: Confirm production dependency advisories
        run: npm audit --omit=dev --audit-level=high
