name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Private-repo Actions billing rounds every job up to a whole minute, so the
  # fast checks share one job (one checkout, one install). Each check step
  # still runs when an earlier one fails, so a single push reports all
  # failures, and the job fails if any of them fails.
  checks:
    name: Lint, unit tests, release policy + audit
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Release policy tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test .release/preflight.node-check.mjs .release/preview-draft.node-check.mjs lib/release/reliability.test.ts
      - name: Audit production dependencies for high/critical advisories
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build + TypeScript
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether build is needed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If the base commit cannot be compared, retain the full required build.
          if ! changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"; then
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$changed_files" ]] && ! grep -Ev '^docs/' <<< "$changed_files"; then
            echo 'Only docs/ files changed; skipping production build/browser steps.'
            echo 'run_build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js
        if: steps.changes.outputs.run_build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.changes.outputs.run_build == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build
        if: steps.changes.outputs.run_build == 'true'
        run: npm run build
      - name: Install browser
        if: steps.changes.outputs.run_build == 'true'
        run: npx playwright install --with-deps chromium
      - name: Test the production build in a browser
        if: steps.changes.outputs.run_build == 'true'
        run: npm run test:site
