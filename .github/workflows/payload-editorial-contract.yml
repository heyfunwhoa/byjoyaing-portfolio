name: Payload editorial contract (synthetic only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/payload-editorial/**'
      - '.github/workflows/payload-editorial-contract.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/payload-editorial/**'
      - '.github/workflows/payload-editorial-contract.yml'

permissions:
  contents: read

jobs:
  synthetic-contract:
    name: Verify Payload editorial proposal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Validate fictional content and editorial permissions contract
        run: node experiments/payload-editorial/validate.mjs
