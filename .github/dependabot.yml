version: 2
updates:
  # Monthly, grouped updates keep Dependabot from starting a full CI/visual/
  # security run per dependency (private-repo Actions minutes are limited).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Keep @types/node on the major that matches the Node.js runtime in CI.
      # Raise it together with node-version, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One group for every npm update. This also keeps packages that must move
      # together (react/react-dom/@types/react*, next/eslint-config-next/@next/*)
      # in the same PR; a PR that bumps only one of them fails CI.
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
